<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link rel="icon" href="./assets/logo.png">

    <title>Spotify - Web Player: Music for everyone</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="main">

        <div class="sidebar">

            <div class="nav">

                <div class="nav-opt">
                    <i class="fa-solid fa-house"></i>
                    <a href="#">Home</a>
                </div>

                <div class="nav-opt">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <a href="#">Search</a>
                </div>

            </div>


            <div class="library">

                <div class="opt">

                    <div class="lib-opt nav-opt">
                        <img src="./assets/library_icon.png">
                        <a href="#">Your Library</a>
                    </div>

                    <div class="icons">
                        <i class="fa-solid fa-plus"></i>
                        <i class="fa-solid fa-right-long"></i>
                    </div>

                </div>


                <div class="lib-box">

                    <div class="box">
                        <p class="box-p1">create your first playlist</p>
                        <p class="box-p2">It's easy, we'll help you</p>
                        <button class="badge">Create Playlist</button>
                    </div>

                    <div class="box">
                        <p class="box-p1">Let's find podcast to foll0w</p>
                        <p class="box-p2">we'll keep you updated on new episodes</p>
                        <button class="badge">Browse Podcast</button>
                    </div>

                </div>

            </div>

        </div>


        <div class="main-content">
            <div class="sticky-nav">
                <div class="icon">
                <img src="./assets/backward_icon.png">
                <img src="./assets/forward_icon.png" class="hide">
                </div>
                <div class="btnbadge">
                <button class="badge navitem hide">Explore Premium</button>
                <button class="badge navitem dark-badge"><i class="fa-solid fa-circle-down"></i>Install App</button>
                <i class="fa-regular fa-user navitem"></i>
                </div>
            </div>
            <div class="cards">
            </div>
        </div>

        <div class="music-player">
            music-player
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Popcorn Cart</title>

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                🍿 Popcorn Cart
            </a>

            <span class="text-white">
                🛒 Cart
            </span>
        </div>
    </nav>


    <!-- Main Content -->
    <main class="container py-5">

        <div class="text-center mb-5">
            <h1 class="fw-bold">🍿 Popcorn Menu</h1>
            <p class="text-muted">
                Choose your favourite popcorn.
            </p>
        </div>


        <div class="row g-4">

            <!-- Small -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">

                        <div class="display-1">🍿</div>

                        <h3>Small Popcorn</h3>

                        <p class="text-muted">
                            Small size
                        </p>

                        <h4>₹50</h4>

                        <button 
                            class="btn btn-dark w-100"
                            onclick="checkPrice('s')">
                            Add to Cart
                        </button>

                    </div>
                </div>
            </div>


            <!-- Medium -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">

                        <div class="display-1">🍿</div>

                        <h3>Medium Popcorn</h3>

                        <p class="text-muted">
                            Medium size
                        </p>

                        <h4>₹100</h4>

                        <button 
                            class="btn btn-dark w-100"
                            onclick="checkPrice('m')">
                            Add to Cart
                        </button>

                    </div>
                </div>
            </div>


            <!-- Large -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">

                        <div class="display-1">🍿</div>

                        <h3>Large Popcorn</h3>

                        <p class="text-muted">
                            Large size
                        </p>

                        <h4>₹200</h4>

                        <button 
                            class="btn btn-dark w-100"
                            onclick="checkPrice('l')">
                            Add to Cart
                        </button>

                    </div>
                </div>
            </div>


            <!-- XL -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="card h-100 shadow-sm">
                    <div class="card-body text-center">

                        <div class="display-1">🍿</div>

                        <h3>XL Popcorn</h3>

                        <p class="text-muted">
                            Extra large size
                        </p>

                        <h4>₹250</h4>

                        <button 
                            class="btn btn-dark w-100"
                            onclick="checkPrice('xl')">
                            Add to Cart
                        </button>

                    </div>
                </div>
            </div>

        </div>


        <!-- Cart -->
        <div class="card shadow-sm mt-5">

            <div class="card-header bg-dark text-white">
                <h3 class="mb-0">🛒 Your Cart</h3>
            </div>

            <div class="card-body">

                <p id="cartMessage" class="text-muted">
                    No items added yet.
                </p>

                <hr>

                <div class="d-flex justify-content-between">
                    <h4>Total</h4>
                    <h4 id="totalPrice">₹0</h4>
                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            🍿 Enjoy your movie!
        </p>
    </footer>


    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Your JavaScript -->
    <script src="pq2.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in HTML</title>
</head>
<body>
    <ul>
        <li>Kannika</li>
        <li>Vishwa</li>
        <li>Bannu</li>
        <li>Nani</li>

    <ol type="A">
        <li>Kannika</li>
        <li>Vishwa</li>
        <li>Bannu</li>
        <li>Nani</li>
    </ol>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Span Element</title>
</head>

<body>

    <!-- 
        SPAN ELEMENT:

        A <span> is a generic container used to hold
        or group content/elements together.

        It is an inline element.
    -->

    <p>

        <!-- 
            These links are grouped together
            inside the <span> container.
        -->
        <span>

            <a href="https://www.google.com">
                Google Me
            </a>

            |

            <a href="https://www.netflix.com/in/">
                Watch Movies
            </a>

        </span>

        |

        <!-- This link is outside the span container -->
        <a href="https://open.spotify.com">
            Listen to Music
        </a>

    </p>

</body>

</html>

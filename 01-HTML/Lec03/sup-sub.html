<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Superscript and Subscript</title>
</head>

<body>

    <h1>Superscript & Subscript Tags</h1>

    <hr>

    <!-- Superscript Section -->
    <h2>Superscript</h2>

    <p>
        Mathematical Equation:
        a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup>
    </p>

    <p>
        Example:
        x<sup>2</sup> + y<sup>2</sup>
    </p>

    <p>Pythogorous Theorem Says: a<sup>2</sup> + b<sup>2</sup> = c<sup>2</sup></p>

    <hr>

    <!-- Subscript Section -->
    <h2>Subscript</h2>

    <p>
        Chemical Formula:
        H<sub>2</sub>O
    </p>

    <p>
        Carbon Dioxide:
        CO<sub>2</sub>
    </p>

    <p>Formula for Glucose : C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>

    <hr>

    <p>
        <strong>HTML makes text go up with &lt;sup&gt; and down with &lt;sub&gt;!</strong>
    </p>

    


</body>

</html>

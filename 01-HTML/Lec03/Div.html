<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Div Element</title>
</head>

<body>

    <!-- 
        DIV ELEMENT:
        A <div> is a container used to hold
        or group other HTML elements together.

        It is a block-level element.
    -->

    <div>

        <!-- Links grouped together inside the div -->
        <a href="https://www.google.com">Google Me</a>

        |

        <a href="https://www.netflix.com/in/">Watch Movies</a>

    </div>

    <!-- This link is outside the div container -->
    <a href="https://open.spotify.com">Listen to Music</a>

</body>

</html>

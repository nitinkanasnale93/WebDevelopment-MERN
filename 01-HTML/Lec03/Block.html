<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Block and Inline Elements</title>
</head>

<body>

    <h1>Block and Inline Elements</h1>

    <hr>

    <!-- Block Elements -->
    <h2>Block Elements</h2>

    <p>Hey!</p>
    <p>What's up?</p>

    <p>
        <strong>Rocky Bhai</strong>
        <br>
        <img
            src="https://i.pinimg.com/736x/6a/91/88/6a9188fa58592c2debf1ee1f1ff17bf6.jpg"
            alt="Rocky Bhai"
            width="150"
            height="200"
        >
    </p>

    <hr>

    <!-- Inline Elements -->
    <h2>Inline Elements</h2>

    <p>
        <a href="https://www.google.com">Google Me</a>
        |
        <a href="https://www.netflix.com/in/">Watch Movies</a>
        |
        <a href="https://open.spotify.com">Listen to Music</a>
    </p>

</body>

</html>

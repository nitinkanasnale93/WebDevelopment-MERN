<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HTML Entities</title>
</head>

<body>

    <h1>HTML Entities</h1>

    <!--
        HTML ENTITIES

        An HTML entity is a piece of text (string) that:

        Starts with an ampersand (&)
        Ends with a semicolon (;)

        Syntax:
        &entityName;

        The browser interprets the entity and
        displays the correct character.
    -->


    <!-- HTML Entity Examples -->

    <h2>Examples</h2>

    <p>a&lt;b</p>

    <p>a&gt;b</p>

    <p>Ampersand: &amp;</p>

    <p>&quot;Important!&quot;</p>

    <p>Hey! &nbsp; &nbsp; Guys</p>


    <!--
        HTML Entities are used to:

        1. Display reserved characters.
        2. Display invisible characters.
        3. Display characters difficult to type.
    -->

    <hr>

    <h2>Quick Revision</h2>

    <p>&amp; → &amp;amp;</p>
    <p>&lt; → &amp;lt;</p>
    <p>&gt; → &amp;gt;</p>
    <p>&quot; → &amp;quot;</p>
    <p>Space → &amp;nbsp;</p>

    <hr>

    <p>
        The Sky is cloudy &#9729; &amp;
        it will rain &#9748; today
    </p>

    <p>Made with &hearts;</p>

</body>

</html>

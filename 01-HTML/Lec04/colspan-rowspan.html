<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colspan & Rowspan</title>
</head>

<body>

    <table border="1">

        <caption>Drinks Menu</caption>

        <thead>
            <tr>
                <th rowspan="2">Item</th>
                <th colspan="2">Price</th>
            </tr>

            <tr>
                <th>INR</th>
                <th>USD</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Frooti</td>
                <td>₹20</td>
                <td>$0.24</td>
            </tr>

            <tr>
                <td>Sprite</td>
                <td>₹20</td>
                <td>$0.24</td>
            </tr>

            <tr>
                <td>Cappuccino</td>
                <td>₹150</td>
                <td>$1.80</td>
            </tr>
        </tbody>

    </table>

</body>

</html>

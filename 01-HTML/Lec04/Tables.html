<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>

<body>

    <table border="2">
        <caption>Food Menu</caption>

        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Sprite</td>
                <td>20</td>
            </tr>

            <tr>
                <td>Tea</td>
                <td>15</td>
            </tr>

            <tr>
                <td>Cappuccino</td>
                <td>300</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Sum</td>
                <td>335</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>

# Basic HTML Structure

```html
<!DOCTYPE html> 
<!-- Tells the browser that we are using HTML5 -->

<html lang="en">
<!-- Root element of the HTML page. lang="en" means English -->

<head>
    <!-- Contains metadata, CSS links, JavaScript links, and other information
         that is usually not displayed on the webpage -->

    <meta charset="UTF-8">
    <!-- Supports most characters and symbols -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage responsive on different screen sizes -->

    <title>Document</title>
    <!-- Sets the title shown in the browser tab -->
</head>

<body>
    <!-- Contains all the content displayed on the webpage -->
</body>

</html>
```

### Important:

* `<!DOCTYPE html>` → HTML5 declaration
* `<html>` → Root tag
* `<head>` → Information about the webpage
* `<title>` → Browser tab title
* `<body>` → Visible webpage content
